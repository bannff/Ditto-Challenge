name: Task
description: A tracked piece of work (non-bug)
title: "task: <short summary>"
labels: ["type:chore"]
body:
  - type: textarea
    id: work
    attributes:
      label: Work items
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - agent-loop
        - safety
        - self-improvement
        - target-app
        - contracts
        - ledger
        - scrub
        - taxonomy
        - memory
        - worktree
        - docs
    validations:
      required: false
