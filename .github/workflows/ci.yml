name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # The same three gates run locally before every commit. No Bedrock credentials
      # here: the unit suite is keyless by design, so CI never needs a secret.
      - run: uv run ruff check src tests scripts
      - run: uv run pyright
      - run: uv run pytest
