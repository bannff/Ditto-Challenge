name: Project Automation
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  add-to-project:
    name: Add to Project
    runs-on: ubuntu-latest
    env:
      ADD_TO_PROJECT_PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
    steps:
      - name: Add to project (if PAT configured)
        if: env.ADD_TO_PROJECT_PAT != ''
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/bannff/projects/17
          github-token: ${{ env.ADD_TO_PROJECT_PAT }}
      - name: Explain missing project PAT
        if: env.ADD_TO_PROJECT_PAT == ''
        uses: actions/github-script@v7
        with:
          script: |
            const body = "⚠️ Project automation is not configured: `ADD_TO_PROJECT_PAT` secret is missing.\n\nTo enable auto-add to project, add a PAT with access to the target project and set it as the `ADD_TO_PROJECT_PAT` repository secret.";
            if (context.eventName === 'issues') {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
